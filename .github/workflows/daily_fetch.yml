name: Daily Faction Stats

on:
  schedule:
    # 12:05 UTC — after Torn day rolls at noon
    - cron: '5 12 * * *'
  workflow_dispatch:
    inputs:
      backfill_from:
        description: 'Backfill from date (YYYY-MM-DD) — leave empty for normal run'
        required: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Torn stats
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node fetch_stats.js

      - name: Commit and push data
        run: |
          git config user.name "torn-bot"
          git config user.email "bot@torn"
          git add data/
          git diff --staged --quiet || git commit -m "stats: $(date -u +%Y-%m-%d) Torn day"
          git push origin HEAD:main
